name: Build APK

on:
  workflow_dispatch:
    inputs:
      private_build:
        description: 'Private build for the initiator only (minting entrance open; versionCode +1; artifact is never released)'
        type: boolean
        default: false
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JS dependencies
        run: npm ci

      # Private builds (manual dispatch only): open the minting entrance via
      # EXPO_PUBLIC_MINT_OPEN (read in src/screens/Mint.tsx) and mark the
      # build as private with a -pvt version suffix and versionCode +1, so
      # it installs over the public build and later public builds install
      # over it. The APK stays a workflow artifact; it is never released.
      - name: Private build adjustments
        if: ${{ inputs.private_build }}
        run: |
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.android.versionCode+=1;j.expo.version+='-pvt';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('private build:',j.expo.version,'versionCode',j.expo.android.versionCode);"

      # Plain Gradle build (no EAS account needed). The release APK is
      # signed after the build with apksigner using the project keystore
      # kept in repo secrets (KEYSTORE_B64 / KEYSTORE_PASSWORD), so every
      # build of this app carries the same signature and updates install
      # over each other.
      - name: Prebuild Android project
        run: npx expo prebuild -p android --no-install

      - name: Build release APK (unsigned)
        working-directory: android
        env:
          EXPO_PUBLIC_MINT_OPEN: ${{ inputs.private_build && '1' || '' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Align and sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*unsigned*.apk android/app/build/outputs/apk/release/app-release.apk 2>/dev/null | head -1)
          test -n "$UNSIGNED"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            --ks-key-alias ethcaw --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$RUNNER_TEMP/eth-caw.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/eth-caw.apk" | head -3

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eth-caw-apk
          path: ${{ runner.temp }}/eth-caw.apk
          if-no-files-found: error
